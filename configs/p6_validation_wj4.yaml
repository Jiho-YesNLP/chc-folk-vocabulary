# Stage 6 — convergent validation against WJ IV (the real run, on frozen materials).
#
#   uv run python scripts/p6_validation_pilot.py configs/p6_validation_wj4.yaml
#
# Materials frozen 2026-09-28 (wj4-ops-v1; sha256 of tests in the file). Condition differences
# are reported descriptively (MRR, accuracy).

materials_path: data/raw/validation/wj4_operationalizations.json
inventory_path: data/raw/chc_taxonomy.json   # + sibling chc_project_annotations.json
extraction_annotator: llm:claude-opus-5.5   # informational: the Stage 4 run all _opus55 paths below come from
descriptions_dir: data/processed/descriptions/track_a_opus55
fingerprints_dir: data/processed/fingerprints/track_a_opus55   # assembled fingerprints for condition E (profile)
corpus_dir: data/processed/corpus/track_a_v10
coverage_path: results/annotation_stats/coverage.csv   # zero-prevalence targets (tier "none") for the report
sep: " [SEP] "
span_cache_path: data/interim/repr_ablation_vectors_opus55.npz
encoder_model: BAAI/bge-m3
device: cpu
batch_size: 64
top_k: 5
cap_per_ability: 30
min_support: 10
# Cross-listed abilities are resolved to one parent in the taxonomy (RS, WS -> Grw; P -> Gs),
# so no ability is excluded as a duplicate.
exclude_abilities: []
random_seed: 17
bootstrap_n: 10000
out_dir: results/validation_wj4_opus55
